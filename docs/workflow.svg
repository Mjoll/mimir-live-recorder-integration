<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .box { fill: #f3f6f9; stroke: #36506b; stroke-width: 2; }
      .name { font-size: 20px; font-weight: bold; fill: #1c2b3a; text-anchor: middle; }
      .sub { font-size: 13px; fill: #4a5c6e; text-anchor: middle; }
      .line { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #888; stroke-dasharray: 6 4; }
      .label { font-size: 14px; fill: #1c2b3a; }
      .badge { fill: #36506b; }
      .num { font-size: 12px; font-weight: bold; fill: #fff; text-anchor: middle; }
    </style>
  </defs>
  <rect width="960" height="520" fill="#fff"/>

  <!-- Parties and systems -->
  <rect class="box" x="40" y="200" width="180" height="110" rx="10"/>
  <text class="name" x="130" y="250">Recorder</text>
  <text class="sub" x="130" y="272">vendor system</text>

  <rect class="box" x="390" y="40" width="200" height="100" rx="10"/>
  <text class="name" x="490" y="82">Kelda live folder</text>
  <text class="sub" x="490" y="104">on-premises</text>

  <rect class="box" x="390" y="370" width="200" height="100" rx="10"/>
  <text class="name" x="490" y="412">S3 bucket</text>
  <text class="sub" x="490" y="434">Generated Media Location</text>

  <rect class="box" x="740" y="200" width="180" height="110" rx="10"/>
  <text class="name" x="830" y="250">Mimir</text>
  <text class="sub" x="830" y="272">cloud</text>

  <!-- 1: create the item, get its ID back -->
  <line class="line" x1="220" y1="235" x2="738" y2="235"/>
  <circle class="badge" cx="300" cy="219" r="10"/><text class="num" x="300" y="223">1</text>
  <text class="label" x="316" y="224">Create the item: POST /api/v1/items</text>
  <line class="line soft" x1="740" y1="275" x2="222" y2="275"/>
  <text class="label" x="480" y="296" text-anchor="middle">item ID</text>

  <!-- 2: growing high-res file -->
  <line class="line" x1="180" y1="200" x2="388" y2="96"/>
  <circle class="badge" cx="50" cy="130" r="10"/><text class="num" x="50" y="134">2</text>
  <text class="label" x="66" y="135">Write growing &lt;itemId&gt;.mxf</text>

  <!-- 3: proxy segments and thumbnails -->
  <line class="line" x1="180" y1="310" x2="388" y2="418"/>
  <circle class="badge" cx="50" cy="390" r="10"/><text class="num" x="50" y="394">3</text>
  <text class="label" x="66" y="395">Upload webproxy.NNNNNN.ts and</text>
  <text class="label" x="66" y="413">live.NNNNN.jpg to &lt;prefix&gt;&lt;itemId&gt;/</text>

  <!-- 4 and 5: Kelda starts and ends the recording -->
  <line class="line" x1="590" y1="96" x2="798" y2="198"/>
  <circle class="badge" cx="622" cy="50" r="10"/><text class="num" x="622" y="54">4</text>
  <text class="label" x="638" y="55">Finds the file: recording starts</text>
  <circle class="badge" cx="622" cy="76" r="10"/><text class="num" x="622" y="80">5</text>
  <text class="label" x="638" y="81">10 s without growth: recording ends</text>

  <!-- Segments reach Mimir as they land -->
  <line class="line" x1="590" y1="420" x2="798" y2="312"/>
  <text class="label" x="622" y="455">Bucket notification:</text>
  <text class="label" x="622" y="473">each segment is ingested as it lands</text>
</svg>
